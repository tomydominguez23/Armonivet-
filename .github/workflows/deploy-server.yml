name: Deploy servidor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Elegir FTP o SSH
        id: dest
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FTP_PASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::error::Falta el secreto DEPLOY_HOST (servidor FTP de cPanel)."
            exit 1
          fi
          if [ -n "$SSH_KEY" ]; then
            echo "mode=ssh" >> "$GITHUB_OUTPUT"
          elif [ -n "$FTP_PASS" ]; then
            echo "mode=ftp" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Falta DEPLOY_SSH_KEY o DEPLOY_PASSWORD."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Publicar por SSH
        if: steps.dest.outputs.mode == 'ssh'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude .well-known --exclude cgi-bin
          path: dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
          remote_port: 22

      - name: Publicar por FTP
        if: steps.dest.outputs.mode == 'ftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.DEPLOY_PATH }}
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            .well-known/**
            cgi-bin/**
