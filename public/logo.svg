<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Armonivet">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>
  <!-- Watercolor blobs -->
  <g filter="url(#soft)" opacity="0.72">
    <ellipse cx="88" cy="95" rx="52" ry="58" fill="#8FB8C9"/>
    <ellipse cx="118" cy="118" rx="58" ry="52" fill="#E8B4A2"/>
    <ellipse cx="148" cy="88" rx="48" ry="54" fill="#C5D4A0"/>
  </g>
  <!-- Paw outline -->
  <g fill="none" stroke="#2E3236" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- toes -->
    <ellipse cx="72" cy="58" rx="16" ry="20"/>
    <ellipse cx="104" cy="42" rx="15" ry="19"/>
    <ellipse cx="136" cy="42" rx="15" ry="19"/>
    <ellipse cx="168" cy="58" rx="16" ry="20"/>
    <!-- main pad -->
    <path d="M78 108
      C68 92, 78 78, 100 74
      C112 72, 128 72, 140 74
      C162 78, 172 92, 162 108
      C152 128, 140 148, 120 152
      C100 148, 88 128, 78 108Z"/>
  </g>
  <text x="120" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#2E3236">Armonivet</text>
</svg>
